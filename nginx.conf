events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Rota para a API em Python (Flask)
        location /api/flask/ {
            proxy_pass http://flask-api:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rota para a API em Node.js
        location /api/node/ {
            proxy_pass http://node-api:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
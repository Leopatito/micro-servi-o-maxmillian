services:
  flask-api:
    build: ./python
    container_name: flask-api
    ports:
      - "5000:5000"
    volumes:
      - sqlite_data:/app/data
  nodejs-api:
    build: ./nodejs
    container_name: node-api
    ports:
     - "3000:3000"
    volumes:
      - trabalho-max_sqlite_data:/app/data:rw

volumes:
  sqlite_data:
  trabalho-max_sqlite_data:
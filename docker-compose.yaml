services:
  # API Gateway: único ponto de entrada HTTP da aplicação.
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      flask-api:
        condition: service_started
      nodejs-api:
        condition: service_started

  # Banco exclusivo do microsserviço de tarefas.
  postgres-tarefas:
    image: postgres:16-alpine
    container_name: postgres-tarefas
    environment:
      POSTGRES_DB: tarefas_db
      POSTGRES_USER: tarefas_user
      POSTGRES_PASSWORD: tarefas_password
    volumes:
      - tarefas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarefas_user -d tarefas_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Banco exclusivo do microsserviço de usuários.
  postgres-usuarios:
    image: postgres:16-alpine
    container_name: postgres-usuarios
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: usuarios_user
      POSTGRES_PASSWORD: usuarios_password
    volumes:
      - usuarios_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuarios_user -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Microsserviço de usuários (Python/Flask).
  flask-api:
    build: ./python
    container_name: flask-api
    expose:
      - "5000"
    environment:
      PGHOST: postgres-usuarios
      PGPORT: 5432
      PGDATABASE: usuarios_db
      PGUSER: usuarios_user
      PGPASSWORD: usuarios_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASSWORD: app_password
    depends_on:
      postgres-usuarios:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Microsserviço de tarefas (Node.js/Express).
  nodejs-api:
    build: ./nodejs
    container_name: node-api
    expose:
      - "3000"
    environment:
      PGHOST: postgres-tarefas
      PGPORT: 5432
      PGDATABASE: tarefas_db
      PGUSER: tarefas_user
      PGPASSWORD: tarefas_password
    depends_on:
      postgres-tarefas:
        condition: service_healthy

  # Consumidor independente dos eventos publicados pelo microsserviço Flask.
  eventos-worker:
    build: ./python
    container_name: eventos-worker
    command: ["python", "event_worker.py"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASSWORD: app_password
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Message broker para comunicação assíncrona.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app_password
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Coleta métricas dos dois microsserviços.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - nodejs-api
      - flask-api

volumes:
  tarefas_db_data:
  usuarios_db_data:
  rabbitmq_data:

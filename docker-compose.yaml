services:
  # API Gateway (NGINX) centralizando a porta de entrada
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask-api
      - nodejs-api

  flask-api:
    build: ./python
    container_name: flask-api
    expose: # Substitui 'ports' para esconder a porta do mundo externo
      - "5000"
    volumes:
      - sqlite_data:/app/data
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - nodejs-api

  nodejs-api:
    build: ./nodejs
    container_name: node-api
    expose: # Substitui 'ports'
      - "3000"
    volumes:
      - trabalho-max_sqlite_data:/app/data:rw

volumes:
  sqlite_data:
  trabalho-max_sqlite_data: